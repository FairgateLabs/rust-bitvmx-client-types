[package]
name = "bitvmx-client-types"
version = "0.8.6-test"
edition = "2021"

[dependencies]
bitcoin = { version = "0.32.6", features = ["std", "rand-std"] }
serde = { version = "1.0.215", features = ["derive"] }
serde_json = "1.0.96"
uuid = { version = "1.11.0", features = ["v4", "v5"] }
sha2 = "0.10"
thiserror = "2.0.12"
redact = { version = "0.1", features = ["serde", "zeroize"] }
tracing = "0.1.41"

bitvmx-key-manager = { git = "https://github.com/FairgateLabs/rust-bitvmx-key-manager.git", tag = "v0.8.6" }
bitvmx-protocol-builder = { git = "https://github.com/FairgateLabs/rust-bitvmx-protocol-builder.git", tag = "v0.8.6" }
bitcoin-coordinator = { git = "https://github.com/FairgateLabs/rust-bitvmx-bitcoin", tag = "v0.8.6" }
bitvmx-wallet = { git = "https://github.com/FairgateLabs/rust-bitvmx-wallet.git", tag = "v0.8.6" }
bitvmx-broker = { git = "https://github.com/FairgateLabs/rust-bitvmx-broker.git", tag = "v0.8.6" }

[dev-dependencies]
hex = "0.4.3"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[features]
testpanic = []
